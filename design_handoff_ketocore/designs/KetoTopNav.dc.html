<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<style>
  .ktn-msym { font-family: 'Material Symbols Outlined'; font-style: normal; line-height: 1; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .ktn-link { transition: color .13s; }
  .ktn-link:hover { color: #1a140e !important; }
  .ktn-burger { display: none; }
  @media (max-width: 820px) {
    .ktn-desk { display: none !important; }
    .ktn-burger { display: flex !important; }
    /* marketing pages get global responsive help too */
    [style*="grid-template-columns: repeat(4, 1fr)"] { grid-template-columns: 1fr 1fr !important; }
    [style*="grid-template-columns: repeat(3, 1fr)"] { grid-template-columns: 1fr !important; }
    [style*="grid-template-columns: repeat(2, 1fr)"],
    [style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 520px) {
    [style*="grid-template-columns: repeat(4, 1fr)"] { grid-template-columns: 1fr 1fr !important; }
  }
</style>
</helmet>
<nav style="position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:rgba(244,239,230,0.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(26,20,14,0.06);font-family:'Inter',sans-serif">
  <a href="KetoCore Landing.dc.html" style="display:flex;align-items:center;gap:11px;text-decoration:none">
    <img src="assets/logo.svg" alt="KetoCore" style="width:34px;height:34px;border-radius:10px">
    <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:18px;letter-spacing:-0.02em;color:#1a140e">KetoCore</span>
  </a>
  <div class="ktn-desk" style="display:flex;align-items:center;gap:30px">
    <a href="KetoCore Protocolos.dc.html" class="ktn-link" style="font-size:14px;font-weight:500;color:rgba(26,20,14,0.62);text-decoration:none">Protocolos</a>
    <a href="KetoCore Aprender.dc.html" class="ktn-link" style="font-size:14px;font-weight:500;color:rgba(26,20,14,0.62);text-decoration:none">Aprender</a>
    <a href="KetoCore Recetas.dc.html" class="ktn-link" style="font-size:14px;font-weight:500;color:rgba(26,20,14,0.62);text-decoration:none">Recetas</a>
    <a href="KetoCore Herramientas.dc.html" class="ktn-link" style="font-size:14px;font-weight:500;color:rgba(26,20,14,0.62);text-decoration:none">Herramientas</a>
    <a href="KetoCore Retos.dc.html" class="ktn-link" style="font-size:14px;font-weight:500;color:rgba(26,20,14,0.62);text-decoration:none">Retos</a>
    <a href="KetoCore Historias.dc.html" class="ktn-link" style="font-size:14px;font-weight:500;color:rgba(26,20,14,0.62);text-decoration:none">Historias</a>
    <a href="KetoCore Dashboard v2.dc.html" class="ktn-p" style="display:flex;align-items:center;gap:7px;height:42px;padding:0 20px;border-radius:12px;background:#ff4d00;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13.5px;text-decoration:none;box-shadow:0 4px 14px rgba(255,77,0,0.28)">Entrar a la app</a>
  </div>
  <button class="ktn-burger ktn-open" style="width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid rgba(26,20,14,0.1);cursor:pointer;align-items:center;justify-content:center"><span class="ktn-msym" style="font-size:24px;color:#1a140e">menu</span></button>
</nav>

<!-- mobile menu -->
<div class="ktn-menu" style="position:fixed;inset:0;z-index:70;display:none;font-family:'Inter',sans-serif">
  <div class="ktn-scrim" style="position:absolute;inset:0;background:rgba(26,20,14,0.4)"></div>
  <div style="position:absolute;top:0;right:0;bottom:0;width:80%;max-width:320px;background:#f4efe6;padding:22px;display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:17px;color:#1a140e">Menú</span>
      <button class="ktn-close" style="width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid rgba(26,20,14,0.1);cursor:pointer;display:flex;align-items:center;justify-content:center"><span class="ktn-msym" style="font-size:22px;color:#1a140e">close</span></button>
    </div>
    <a href="KetoCore Protocolos.dc.html" style="padding:14px 16px;border-radius:12px;font-size:15px;font-weight:600;color:#1a140e;text-decoration:none;background:#fff">Protocolos</a>
    <a href="KetoCore Aprender.dc.html" style="padding:14px 16px;border-radius:12px;font-size:15px;font-weight:600;color:#1a140e;text-decoration:none;background:#fff">Aprender</a>
    <a href="KetoCore Recetas.dc.html" style="padding:14px 16px;border-radius:12px;font-size:15px;font-weight:600;color:#1a140e;text-decoration:none;background:#fff">Recetas</a>
    <a href="KetoCore Herramientas.dc.html" style="padding:14px 16px;border-radius:12px;font-size:15px;font-weight:600;color:#1a140e;text-decoration:none;background:#fff">Herramientas</a>
    <a href="KetoCore Retos.dc.html" style="padding:14px 16px;border-radius:12px;font-size:15px;font-weight:600;color:#1a140e;text-decoration:none;background:#fff">Retos</a>
    <a href="KetoCore Historias.dc.html" style="padding:14px 16px;border-radius:12px;font-size:15px;font-weight:600;color:#1a140e;text-decoration:none;background:#fff">Historias</a>
    <a href="KetoCore Dashboard v2.dc.html" style="margin-top:8px;padding:15px;border-radius:13px;text-align:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:15px;color:#fff;text-decoration:none;background:#ff4d00">Entrar a la app</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:80}}">
class Component extends DCLogic {
  bind() {
    const menu = document.querySelector('.ktn-menu');
    if (!menu) { setTimeout(() => this.bind(), 60); return; }
    if (menu._bound) return; menu._bound = true;
    const open = () => menu.style.display = 'block';
    const close = () => menu.style.display = 'none';
    document.querySelectorAll('.ktn-open').forEach(b => b.addEventListener('click', open));
    const s = menu.querySelector('.ktn-scrim'); if (s) s.addEventListener('click', close);
    const c = menu.querySelector('.ktn-close'); if (c) c.addEventListener('click', close);
  }
  componentDidMount() { this.bind(); }
  renderVals() { return {}; }
}
</script>
</body>
</html>
